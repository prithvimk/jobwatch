# Input to `uv run python -m detector.board_map`.
# careers_url: the company's public careers entry point.
# hints: explicit locators, tried before fingerprinting the page. Keys:
#   greenhouse/lever/ashby/smartrecruiters: board slug
#   workday: "https://<tenant>.<wdN>.myworkdayjobs.com/<site>"
#   oracle:  "https://<host>/hcmUI/CandidateExperience/en/sites/<siteNumber>"
#   jibe: site base URL | eightfold: "<host>|<domain>" | beesite: tenant | amazon / atlassian: any value
# platform: scrape-only front end (no JSON found yet). backend: the ATS the apply button goes to.
# confirm: the company identity itself is a guess and needs the user to confirm.
# Hints were found by reading each careers page / sample job page on 2026-11-21.
boards:
  - name: Amazon
    careers_url: https://www.amazon.jobs/en/search?country=IND
    hints: {amazon: "1"}
  - name: JPMC
    careers_url: https://careers.jpmorgan.com/in/en/home
    hints: {oracle: "https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001"}
  - name: Google
    careers_url: https://www.google.com/about/careers/applications/jobs/results/?location=India
    platform: google-careers  # server-rendered HTML, job IDs in page; no public JSON
  - name: Microsoft
    careers_url: https://jobs.careers.microsoft.com/global/en/search?lc=India
    hints: {eightfold: "apply.careers.microsoft.com|microsoft.com"}
  - name: Teradata
    careers_url: https://careers.teradata.com/jobs
    hints: {gr8people: "https://careers.teradata.com"}
    note: "gr8 People career site (Next.js over GraphQL). Added 2026-11-22"
  - name: MSCI
    careers_url: https://careers.msci.com/
    hints: {jibe: "https://msci.jibeapply.com"}
    backend: icims
  - name: Atlassian
    careers_url: https://www.atlassian.com/company/careers/all-jobs
    hints: {atlassian: "1"}
    backend: icims
  - name: Sarvam
    careers_url: https://www.sarvam.ai/careers
